<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#684a68" />
<title>پنل مرچنت سورکده</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap');

/* ===== Design tokens — aligned with Soorkadeh Admin panel ===== */
:root{--purple:#741477;--purple2:#5B195E;--purple3:#941985;--blue:#941985;--blue-t:#F2E3F2;--green:#16866B;--green-t:#E5F5F1;--orange:#C47A16;--orange-t:#FFF3E2;--red:#C43E58;--red-t:#FCEAED;--bg:#FCFAFC;--surface:#FFFFFF;--surface2:#F8F1F8;--text:#17142F;--muted:#6F6875;--border:#E7DFE9;--shadow:0 12px 32px rgba(48,19,54,.08);--r:18px;--rs:12px;--grad:linear-gradient(135deg,#741477,#9C168F)}
html[data-theme="dark"]{--bg:#181120;--surface:#241A29;--surface2:#2B1E31;--text:#FBF3FB;--muted:#C6B7C6;--border:#42324A;--blue-t:rgba(148,25,133,.22);--green-t:rgba(22,134,107,.22);--orange-t:rgba(196,122,22,.22);--red-t:rgba(196,62,88,.22);--shadow:0 14px 38px rgba(0,0,0,.36)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--text);font-family:Vazirmatn,Inter,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}

/* ===== Login screen ===== */
.login-screen{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 12% 15%,rgba(204,72,190,.18),transparent 30%),radial-gradient(circle at 88% 24%,rgba(116,20,119,.14),transparent 32%),#f7eff8;padding:24px}
.login-card{width:min(980px,100%);display:grid;grid-template-columns:.95fr 1.05fr;background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:0 30px 90px rgba(48,19,54,.20);overflow:hidden}
.login-visual{background:linear-gradient(160deg,#57305A,#7A3E78 90%);color:#fff;padding:34px;display:flex;align-items:center;justify-content:center;min-height:500px;position:relative;overflow:hidden}
.login-visual:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.10);top:-80px;inset-inline-end:-90px}
.login-visual:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-70px;inset-inline-start:-70px}
.login-visual>*{position:relative}
.login-brand-lockup{display:flex;align-items:center;gap:10px}
.brand-logo{display:block;object-fit:contain}.login-brand-lockup .brand-logo{width:150px;height:54px;border-radius:12px}.login-mini-logo .brand-logo{width:118px;height:42px;border-radius:10px}.brand .brand-logo{width:126px;height:42px;border-radius:10px}
.login-brand-lockup b{font-size:19px;display:block}.login-brand-lockup small{font-size:11px;color:rgba(255,255,255,.72);direction:ltr;display:block}
.login-visual h1{font-size:30px;margin:18px 0 10px;line-height:1.35}.login-visual p{line-height:1.9;color:rgba(255,255,255,.82);margin:0}
.login-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.login-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px}
.login-stat b{display:block;font-size:19px}.login-stat small{color:rgba(255,255,255,.75);font-weight:800}
.login-form{padding:38px;display:flex;flex-direction:column;justify-content:center;gap:16px}
.login-form-head{display:flex;align-items:center;gap:9px}
.login-mini-logo{display:flex;align-items:center;gap:8px}.login-mini-logo .mark{width:30px;height:30px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.login-mini-logo b{font-size:14px}
.login-form h2{margin:0;font-size:26px}.login-form p{margin:0;color:var(--muted);line-height:1.8}
.login-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.otp-login-btn{border:0;background:transparent;color:var(--purple3);font-weight:900;font-size:12.5px;padding:0;display:inline-flex;align-items:center;gap:6px}
.otp-login-btn:hover{color:var(--purple)}
.forgot-link{border:0;background:transparent;color:var(--purple3);font-weight:900;font-size:12.5px;padding:0}
.login-hint{color:var(--muted);font-size:11.5px;line-height:1.8;background:var(--surface2);border:1px dashed var(--border);border-radius:12px;padding:9px 11px}
.login-submit{background:#843d82!important;box-shadow:0 10px 22px rgba(91,25,94,.24)!important}
.social-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px}.social-divider:before,.social-divider:after{content:"";height:1px;background:var(--border);flex:1}
.social-login{display:grid;grid-template-columns:1fr 1fr;gap:10px}.social-btn{height:43px;border:1px solid var(--border);background:#fff;color:#242124;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:13px}.social-btn:hover{background:var(--surface2)}.social-btn svg{width:18px;height:18px;flex:0 0 auto}
@media(max-width:860px){.login-card{grid-template-columns:1fr}.login-visual{min-height:auto}.login-stats{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:560px){.login-form,.login-visual{padding:24px}.login-stats{grid-template-columns:1fr}.login-visual h1{font-size:24px}}

/* ===== App shell ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex:0 0 auto;background:linear-gradient(180deg,#57305A 0%,#70406F 52%,#7A3E78 100%);color:#fff;display:flex;flex-direction:column;transition:.18s;position:sticky;top:0;height:100vh;box-shadow:6px 0 24px rgba(54,28,58,.12)}
.sidebar.collapsed{width:74px}
.sidebar-top{min-height:auto;display:flex;align-items:center;gap:8px;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.14)}
.sidebar-profile{flex:1;min-width:0;border:0;background:rgba(255,255,255,.10);border-radius:14px;padding:8px;display:flex;align-items:center;gap:9px;color:#fff;text-align:start}
.profile-avatar-photo{width:38px;height:38px;border-radius:12px;overflow:hidden;flex:0 0 auto;border:2px solid rgba(255,255,255,.6);box-shadow:0 5px 14px rgba(24,10,27,.22)}
.profile-avatar-photo img{width:100%;height:100%;object-fit:cover;display:block}
.sidebar-profile-copy{min-width:0;line-height:1.3}.sidebar-profile-copy b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.sidebar-profile-copy small{font-size:10px;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sidebar-bell{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;position:relative}
.sidebar-bell:hover{background:rgba(255,255,255,.22)}
.sidebar-toggle{width:32px;height:32px;flex:0 0 auto;border-radius:9px;background:rgba(255,255,255,.10);border:0;color:rgba(255,255,255,.8);display:grid;place-items:center}
.sidebar-toggle:hover{background:rgba(255,255,255,.18);color:#fff}
.sidebar.collapsed .sidebar-profile-copy,.sidebar.collapsed .sidebar-bell{display:none}
.sidebar.collapsed .sidebar-top{justify-content:center}
.sidebar.collapsed .sidebar-profile{flex:none;padding:6px}
.nav{display:flex;flex-direction:column;gap:4px;padding:10px 8px 16px;overflow:auto;flex:1}
.nav-btn{border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;text-align:start;font-weight:400;width:100%}
.nav-btn:hover{background:rgba(255,255,255,.10);color:#fff}
.nav-btn.active{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.nav-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;box-shadow:none;color:#fff;background:transparent!important}
.nav-btn.active .nav-ico{background:rgba(255,255,255,.12)!important;color:#fff!important;box-shadow:none}
.nav-ico svg,.svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-text{min-width:0}.nav-name{font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar.collapsed .nav-text{display:none}.sidebar.collapsed .nav-btn{justify-content:center;padding:9px}
.sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.14)}
.logout-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.10)!important;color:#fff!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:none!important}
.logout-btn:hover{background:#fff!important;color:#713B70!important}
.sidebar.collapsed .logout-btn span{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:linear-gradient(100deg,#57305A,#754173 55%,#8A4B83);color:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:10px 22px;min-height:62px;box-shadow:0 5px 18px rgba(54,28,58,.14)}
.topbar-right{justify-self:start;display:flex;align-items:center;gap:10px}
.topbar-left{justify-self:end;display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.mobile-menu{display:none;width:34px;height:34px;border-radius:9px;align-items:center;justify-content:center;color:#fff;border:0;background:transparent}
.mobile-menu span{display:block;width:18px;height:2px;background:#fff;margin:3px auto;border-radius:2px}
.mobile-menu:hover{background:rgba(255,255,255,.16)}
.brand{justify-self:center;display:flex;align-items:center;gap:9px}
.brand .mark{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.brand b{font-size:18px;letter-spacing:.3px;display:block}.brand small{font-size:9.5px;color:rgba(255,255,255,.72);display:block}
.toggle-group{display:flex;align-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.19);border-radius:20px;padding:3px;gap:2px}
.toggle-btn{border:0;background:transparent;color:rgba(255,255,255,.74);font-size:11.5px;font-weight:900;padding:5px 10px;border-radius:16px;display:grid;place-items:center}
.toggle-btn.active{background:#fff;color:#713B70}
.topbar-bell{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.19);display:grid;place-items:center;color:#fff;position:relative}
.topbar-bell:hover{background:rgba(255,255,255,.22)}
.notif-count{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);border:2px solid #fff;color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:900}
.status-pill-group{display:flex;align-items:center;gap:8px}

.page-head{min-height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px}
.main-title{font-size:17px;font-weight:900}
.breadcrumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}.breadcrumb b{color:var(--text)}

.content{width:100%;max-width:1560px;margin:0 auto;padding:18px 22px 40px;min-width:0;overflow-x:hidden}

/* ===== Shared components (cards / tables / forms / buttons) ===== */
.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px}
.page-title h1{margin:0;font-size:23px}.page-title p{margin:6px 0 0;color:var(--muted);line-height:1.7;font-size:13px}
.grid{display:grid;gap:14px}.cols4{grid-template-columns:repeat(4,1fr)}.cols3{grid-template-columns:repeat(3,1fr)}.cols2{grid-template-columns:1.15fr .85fr}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.card.soft{box-shadow:none;background:var(--surface2)}
.hero{background:linear-gradient(135deg,rgba(116,20,119,.12),rgba(148,25,133,.10)),var(--surface);border:1px solid var(--border);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr 220px;gap:18px;align-items:center}
.hero h1{margin:6px 0;font-size:26px}.hero p{margin:0;color:var(--muted);line-height:1.8}
.hero img{width:100%;height:150px;object-fit:cover;border-radius:16px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--rs);padding:9px 13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13px}
.btn:hover{background:var(--surface2)}
.btn.primary{border:0;background:var(--grad);color:#fff;box-shadow:0 10px 22px rgba(148,25,133,.24)}
.btn.danger{background:var(--red-t);color:var(--red)}
.btn.dark{background:#221527;color:#fff;border:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11.5px;font-weight:900;background:var(--blue-t);color:var(--blue)}
.pill.green{background:var(--green-t);color:#0f6650}.pill.amber{background:var(--orange-t);color:#a06213}.pill.red{background:var(--red-t);color:var(--red)}.pill.gray{background:rgba(111,104,117,.12);color:var(--muted)}.pill.blue{background:var(--blue-t);color:var(--blue)}
.kpi{min-height:118px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kpi small{color:var(--muted);font-weight:800}.kpi h2{margin:10px 0 2px;font-size:27px}
.ico{width:44px;height:44px;border-radius:15px;background:var(--blue-t);color:var(--blue);display:grid;place-items:center;font-size:20px}
.split{display:flex;align-items:center;justify-content:space-between;gap:12px}
.list{display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px}
.table{width:100%;border-collapse:collapse;font-size:12.8px}
.table th{background:var(--surface2);color:var(--muted);font-size:11px;font-weight:900;text-align:start;border-bottom:2px solid var(--border);padding:11px 12px;white-space:nowrap}
.table td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.field{display:grid;gap:6px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field label{font-size:12px;color:var(--muted);font-weight:800}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:var(--rs);padding:9px 11px;background:var(--surface);color:var(--text);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--purple3);box-shadow:0 0 0 3px var(--blue-t)}
textarea{min-height:92px;resize:vertical}
.disabled-field{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.tabs,.metric-tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button,.metric-btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 12px;font-weight:900;color:var(--muted);font-size:12px}
.tabs button.active,.metric-btn.active{background:#221527;color:#fff;border-color:#221527}
.filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(23,20,47,.35);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:100;padding:20px}
.modalbox{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 28px 80px rgba(23,10,30,.28)}
.modalbox h2{margin-top:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#221527;color:#fff;padding:12px 16px;border-radius:999px;z-index:120;font-weight:800}
.switch-row{display:flex!important;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);background:var(--surface2);border-radius:12px;padding:10px 12px;font-weight:850}
@media(max-width:1180px){.cols4{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:repeat(2,1fr)}.cols2{grid-template-columns:1fr}}
@media(max-width:1000px){.app{display:block}.mobile-menu{display:flex}.sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;width:250px;max-width:82vw;z-index:200;transform:translateX(100%);box-shadow:-14px 0 34px rgba(23,10,30,.3);height:100vh}
.sidebar.mobile-open{transform:translateX(0)}
.topbar{grid-template-columns:auto 1fr auto}.brand small{display:none}.content{padding:14px 12px 30px}.page-title{display:block}.hero{grid-template-columns:1fr}.hero img{display:none}.form{grid-template-columns:1fr}.cols4,.cols3{grid-template-columns:1fr}.page-head{padding:10px 14px}}
body.menu-open:before{content:"";position:fixed;inset:0;background:rgba(23,10,30,.4);z-index:150}

/* ===== Merchant-specific components (re-themed) ===== */
.merchant-lock{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
.admin-lock{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}
.package-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.package-card:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
.package-card.silver:before{background:linear-gradient(90deg,#94a3b8,#e2e8f0)}
.package-card.gold:before{background:linear-gradient(90deg,var(--orange),#facc15)}
.package-card.corporate:before{background:linear-gradient(90deg,var(--purple2),var(--purple3))}
.package-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.package-head h2{margin:6px 0 4px;font-size:21px}
.package-settings{display:grid;gap:12px}.package-settings .form{grid-template-columns:repeat(2,1fr)}
.package-menu{display:flex;gap:8px;flex-wrap:wrap}
.package-chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:8px 10px;font-size:12px;font-weight:800}
.readonly-note{background:var(--surface2);border:1px dashed var(--purple3);border-radius:var(--r);padding:12px;color:var(--muted);line-height:1.8}
.days{display:flex;gap:7px;flex-wrap:wrap}
.days label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;background:var(--surface)}

.service-actions{display:flex;gap:8px;flex-wrap:wrap}
.tree-hint{background:var(--surface2);border:1px dashed var(--purple3);border-radius:var(--r);padding:12px;color:var(--muted);line-height:1.8}
.tree-table td:first-child{width:46px}.row-click{cursor:pointer}.row-click:hover{background:var(--surface2)}
.child-row td{background:var(--surface2)}
.child-name{display:flex;align-items:center;gap:8px;padding-inline-start:34px}
.parent-name{display:flex;align-items:center;gap:8px;font-weight:900}
.expand-btn{width:28px;height:28px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:900}
.action-mini{display:flex;gap:6px;flex-wrap:wrap}.action-mini .btn{padding:7px 9px;border-radius:11px;font-size:12px}
.status-note{font-size:12px;color:var(--muted);line-height:1.8}

.dashboard-filter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);margin-bottom:16px}
.dashboard-filter strong{font-size:13px}
.filter-btn{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;color:var(--muted)}
.filter-btn.active{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 20px rgba(148,25,133,.18)}
.chart-wrap{height:250px;border-radius:var(--r);background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);position:relative;overflow:hidden;padding:18px 18px 34px}
.line-svg{width:100%;height:100%}
.axis-label{position:absolute;font-size:11px;color:var(--muted);font-weight:800}.axis-y{top:10px;right:18px}.axis-x{bottom:10px;left:18px}
.chart-legend{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.approval-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(196,122,22,.35);background:var(--orange-t);color:#8a5610;border-radius:var(--r);padding:13px 15px;margin:0 0 16px}
.approval-banner b{color:#6c4109}
.approval-list{display:grid;gap:9px;margin-top:10px}
.approval-item{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);border-radius:16px;padding:10px 12px;background:var(--surface)}
.kpi-rating h2{font-size:27px}

function barChart(type='count'){let rows=dashboardChartData[state.dashboardRange]||dashboardChartData.month;const key=type==='value'?2:1;const vals=rows.map(r=>Number(r[key])||0);const max=Math.max(...vals,1);const w=760,h=215,padL=44,padR=16,padT=22,padB=38;const innerW=w-padL-padR;const innerH=h-padT-padB;const gap=10;const bw=Math.max(20,(innerW-(rows.length-1)*gap)/rows.length);return `<div class="chart-wrap"><span class="axis-label axis-y">${type==='value'?'مبلغ':'تعداد'}</span><span class="axis-label axis-x">زمان</span><svg class="line-svg bar-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="rgba(111,104,117,.28)" stroke-width="1"/><line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="rgba(111,104,117,.28)" stroke-width="1"/>${[0,.25,.5,.75,1].map(t=>{const y=h-padB-t*innerH;return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="rgba(111,104,117,.10)"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#6F6875">${Math.round(max*t).toLocaleString('en-US')}</text>`}).join('')}${rows.map((r,i)=>{const x=padL+i*(bw+gap);const barH=(vals[i]/max)*innerH;const y=h-padB-barH;return `<rect x="${x}" y="${y}" width="${bw}" height="${barH}" rx="10" fill="url(#dashGrad)"><title>${r[0]}: ${formatDashboardValue(vals[i],type)}</title></rect><text class="bar-value" x="${x+bw/2}" y="${Math.max(14,y-7)}" text-anchor="middle">${type==='value'?Math.round(vals[i]/1000)+'k':vals[i]}</text><text x="${x+bw/2}" y="${h-14}" text-anchor="middle" font-size="11" fill="#6F6875" font-weight="700">${r[0]}</text>`}).join('')}<defs><linearGradient id="dashGrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#741477"/><stop offset="100%" stop-color="#DE43B3"/></linearGradient></defs></svg></div>`}

function pageCustomers(){return `${title('مشتریان','سوابق مراجعه، اعتبار مصرفی و بازخورد مشتریان')}<section class="customer-insights compact"><button class="customer-insight-card" onclick="showCustomerInsight('loyal')"><span>◆</span><b>۵ مشتری وفادار</b><i>مشاهده جزئیات</i></button><button class="customer-insight-card" onclick="showCustomerInsight('low')"><span>★</span><b>۵ امتیاز پایین‌تر</b><i>مشاهده جزئیات</i></button><button class="customer-insight-card" onclick="showCustomerInsight('hours')"><span>◷</span><b>ساعات پرتردد مراجعه</b><i>مشاهده جزئیات</i></button></section><section class="customers-list-section"><div class="customers-toolbar"><div><h2>فهرست مراجعات مشتریان</h2><small>${customerVisits.length} مراجعه اخیر</small></div><div class="customer-filters"><label class="customer-search"><span>⌕</span><input id="customerSearch" type="search" placeholder="نام یا کد مشتری" oninput="filterCustomerList()"></label><select id="customerPlanFilter" onchange="filterCustomerList()"><option value="">همه پلن‌ها</option><option>طلایی</option><option>پلاتینیوم</option><option>نقره‌ای</option></select><select onchange="sortCustomerList(this.value)"><option value="date">مرتب‌سازی</option><option value="name">نام مشتری</option><option value="credits">بیشترین اعتبار</option><option value="value">بیشترین ارزش</option><option value="rating">بیشترین امتیاز</option></select></div></div><div class="customer-list-head"><button onclick="sortCustomerList('name')">مشتری</button><button onclick="sortCustomerList('plan')">پلن</button><button onclick="sortCustomerList('date')">تاریخ و ساعت</button><button onclick="sortCustomerList('credits')">اعتبار</button><button onclick="sortCustomerList('value')">ارزش</button><button onclick="sortCustomerList('rating')">امتیاز</button><span>نظر مشتری</span></div><div id="customerListBody" class="customer-list-body">${customerVisits.map(customerVisitCard).join('')}</div></section>`}

function validateCode(){const input=document.getElementById('vcode'),v=input.value.trim();if(!/^\d{5,8}$/.test(v)){toast('کد معتبر مشتری را وارد کنید');input.focus();return}const result=document.getElementById('validationResult');result.classList.remove('hidden');result.innerHTML=`<div class="customer-summary"><div class="customer-card"><div class="customer-stat"><small>نام و نام خانوادگی</small><b>مهتاب شجاعی</b></div><div class="customer-stat"><small>پلن مشتری</small><b>پلن طلایی</b></div><div class="customer-stat"><small>اعتبار قابل استفاده</small><b>۳ اعتبار</b></div><div class="customer-stat"><small>وضعیت مشتری</small><b class="ok">فعال و تأییدشده</b></div></div></div><div class="redemption-form"><div class="validation-status"><div><h2>ثبت خدمات ارائه‌شده</h2><p>خدمات دریافت‌شده را انتخاب و تعداد اعتبار مصرف‌شده برای هر خدمت را وارد کنید.</p></div></div><div class="service-options"><div class="service-option"><input type="checkbox" id="srv-main" value="غذای اصلی"><label for="srv-main"><span>🍽 غذای اصلی (۱۴٪ تخفیف)</span><span class="service-credit"><input id="credit-main" type="number" min="1" max="99" inputmode="numeric" placeholder="تعداد اعتبار" onclick="event.stopPropagation()"></span></label></div><div class="service-option"><input type="checkbox" id="srv-dessert" value="دسر"><label for="srv-dessert"><span>🍰 دسر (۱۰٪ تخفیف)</span><span class="service-credit"><input id="credit-dessert" type="number" min="1" max="99" inputmode="numeric" placeholder="تعداد اعتبار" onclick="event.stopPropagation()"></span></label></div><div class="service-option"><input type="checkbox" id="srv-drink" value="نوشیدنی"><label for="srv-drink"><span>🥤 نوشیدنی (۸٪ تخفیف)</span><span class="service-credit"><input id="credit-drink" type="number" min="1" max="99" inputmode="numeric" placeholder="تعداد اعتبار" onclick="event.stopPropagation()"></span></label></div></div><div class="validation-actions"><button class="btn primary" onclick="submitRedemption('${v}')">ثبت و تأیید استفاده از اعتبار</button></div></div>`}

function submitRedemption(code){const checked=[...document.querySelectorAll('.service-option > input:checked')];if(!checked.length){toast('حداقل یک خدمت را انتخاب کنید');return}const services=[];let totalCredits=0;for(const item of checked){const credits=item.parentElement.querySelector('.service-credit input');const count=Number(credits.value);if(!Number.isInteger(count)||count<1){toast(`تعداد اعتبار مصرف‌شده برای ${item.value} را وارد کنید`);credits.focus();return}totalCredits+=count;services.push(`${item.value}: ${count} اعتبار`)}if(totalCredits>3){toast('مجموع اعتبار مصرفی بیشتر از اعتبار قابل استفاده مشتری است');return}document.getElementById('validationResult').innerHTML=`<div class="validation-success">✓ تراکنش مشتری با کد ${code} ثبت شد<br><small>${services.join(' · ')} · مجموع ${totalCredits} اعتبار</small></div>`;toast('استفاده از اعتبار با موفقیت ثبت شد')}

 <div class="modal-actions"><button class="btn" onclick="closeModal()">انصراف</button><button class="btn primary" onclick="savePackageEditor('${id}')">ذخیره تنظیمات پکیج</button></div>`)
}
function savePackageEditor(id){
 const p=merchantPackages.find(x=>x.id===id); if(!p) return;
 menuItems.forEach(item=>{p.counts[item]=Math.max(0,Number(document.getElementById(`pkg_${id}_${item}`).value)||0)});
 allDays.forEach(d=>{p.schedule[d]={active:document.getElementById(`pkg_${id}_${d}_active`).value==='true',from:document.getElementById(`pkg_${id}_${d}_from`).value||'10:00',to:document.getElementById(`pkg_${id}_${d}_to`).value||'22:00'}});

}

 return `<span class="pill ${cls}">${status}</span>`
}

function serviceParents(){return serviceRows.filter(x=>x.parent===null)}
function serviceRowHtml(r,isChild=false){
 const children=serviceChildren(r.id); const selected=selectedServiceId===r.id?'background:var(--surface2)':'';

 const parentOptions=serviceParents().map(p=>`<option value="${p.id}" ${parentId===p.id?'selected':''}>${p.name}</option>`).join('');
 modal(`<h2>${isEdit?'ویرایش ردیف':isChild?'افزودن زیرمجموعه':'افزودن ردیف اصلی'}</h2><div class="form">

  <div class="field"><label>کد داخلی</label><input id="svc_code" value="${current.code||''}" placeholder="اختیاری"></div>
  <div class="field"><label>سطح</label><select id="svc_parent" ${isChild?'disabled':''}><option value="">ردیف اصلی</option>${parentOptions}</select></div>

  <div class="field"><label>وضعیت</label><select id="svc_active"><option value="true" ${current.active!==false?'selected':''}>فعال</option><option value="false" ${current.active===false?'selected':''}>غیرفعال</option></select></div>
  <div class="field" style="grid-column:1/-1"><label>توضیحات</label><textarea id="svc_desc" placeholder="توضیحات کوتاه">${current.desc||''}</textarea></div>

}
function saveService(mode,id){
 const name=document.getElementById('svc_name').value.trim()||'ردیف جدید';
 const code=document.getElementById('svc_code').value.trim();
 const price=document.getElementById('svc_price').value.trim();
 if(!price){toast('میانگین قیمت اجباری است');document.getElementById('svc_price').focus();return}
 const discount=document.getElementById('svc_discount').value;
 const active=document.getElementById('svc_active').value==='true';
 const desc=document.getElementById('svc_desc').value.trim();
 let parentVal=document.getElementById('svc_parent').value;
 let parent=parentVal?Number(parentVal):null;
 if(mode==='child') parent=id;
 if(mode==='edit'){
  const r=serviceRows.find(x=>x.id===id); if(r){Object.assign(r,{name,code,price,discount,active,desc,status:'در انتظار تأیید ادمین',parent})}
 }else{
  const newId=nextServiceId++; serviceRows.push({id:newId,parent,name,code:code||`SRV-${newId}`,price,discount,active,desc,status:'در انتظار تأیید ادمین'}); selectedServiceId=newId; if(parent) expandedServices[parent]=true;
 }
 closeModal(); toast('درخواست تغییر برای تأیید ادمین ثبت شد'); renderPage();
}
function deleteService(id){
 const childCount=serviceChildren(id).length;
 if(childCount){toast('برای حذف ردیف اصلی، ابتدا زیرمجموعه‌ها را حذف کنید');return}
 serviceRows=serviceRows.filter(x=>x.id!==id); selectedServiceId=serviceRows[0]?.id||null; toast('درخواست حذف برای تأیید ادمین ثبت شد'); renderPage();
}

let selectedMerchantPlan = 'business';
const currentMerchantPlan = 'business';
const merchantPlanData = {
 start:{cls:'start',title:'Partner Start',tag:'برای شروع همکاری',annual:0,duration:'۳ ماه',commission:'رایگان',features:['یک شعبه فعال','۳ کاربر پنل','گزارش پایه','پشتیبانی تیکتی']},
 business:{cls:'business',title:'Partner Business',tag:'پیشنهادی برای اکثر مرچنت‌ها',annual:2400,duration:'۱۲ ماه',commission:'رایگان',features:['تا ۵ شعبه','کاربر نامحدود','گزارش حرفه‌ای','کمپین و اعلان']},
 enterprise:{cls:'enterprise',title:'Partner Enterprise',tag:'برای برندها و زنجیره‌ها',annual:7200,duration:'۱۲ ماه',commission:'رایگان',features:['شعب نامحدود','API و Export','مدیر حساب اختصاصی','گزارش BI']}
};
const addons=[['featured','Featured Merchant','نمایش ویژه در صفحه خانه',250,true],['push','Push Campaign','ارسال کمپین پوش نوتیفیکیشن',180,false],['analytics','Advanced Analytics','گزارش تحلیلی پیشرفته',120,true],['api','API Access','اتصال API محدود',300,false]];
function currentPlanPanel(){const p=merchantPlanData[currentMerchantPlan];return `<div class="profile-plan-card"><div><small>پلن فعال مرچنت</small><h2>${p.title}</h2><span>${p.features.join(' · ')}</span></div><div><small>مبلغ اشتراک سالانه</small><b>${p.annual?`AED ${p.annual.toLocaleString('en-US')}`:'رایگان'}</b></div><div><small>درصد کمیسیون هر اعتبار</small><b>${p.commission}</b></div><div><small>مدت اعتبار</small><b>${p.duration}</b></div></div>`}
function merchantPlanCard(k){const p=merchantPlanData[k];return `<div class="partner-plan ${p.cls} ${selectedMerchantPlan===k?'selected':''}"><span class="pill">${p.tag}</span><h2>${p.title}</h2><div class="plan-data-grid"><div><small>مبلغ اشتراک سالانه</small><b>${p.annual?`AED ${p.annual.toLocaleString('en-US')}`:'رایگان'}</b></div><div><small>درصد کمیسیون سورکده برای هر اعتبار</small><b>${p.commission}</b></div><div><small>مدت اعتبار</small><b>${p.duration}</b></div></div><div class="partner-features">${p.features.map(f=>`<span>${f}</span>`).join('')}</div><button class="btn primary" style="width:100%" onclick="openPlanReview('${k}')">انتخاب و ادامه</button></div>`}
function merchantPlanCheckout(){const p=merchantPlanData[selectedMerchantPlan];const expectedExtra=86;const extraFee=Math.max(0,expectedExtra-p.free)*p.fee;const addonTotal=addons.filter(a=>a[4]).reduce((s,a)=>s+a[3],0);const subtotal=p.monthly+extraFee+addonTotal;const vat=subtotal*.1;return `<div class="checkout-summary"><div class="checkout-line"><span>پلن انتخاب‌شده</span><b>${p.title}</b></div><div class="checkout-line"><span>حق اشتراک ماهانه</span><b>AED ${p.monthly}</b></div><div class="checkout-line"><span>استفاده‌های اضافه تخمینی این ماه</span><b>AED ${extraFee}</b></div><div class="checkout-line"><span>افزونه‌های فعال</span><b>AED ${addonTotal}</b></div><div class="checkout-line"><span>VAT 10%</span><b>AED ${Math.round(vat)}</b></div><div class="checkout-line"><span>جمع تخمینی ماهانه</span><b>AED ${Math.round(subtotal+vat)}</b></div><button class="btn primary" onclick="openMerchantPlanInvoice()">مشاهده فاکتور و پرداخت</button></div>`}
function pagePartnerPlans(){return `${title('پلن‌ها','مشاهده پلن فعلی و انتخاب پلن مناسب کسب‌وکار')}<section class="card current-plan-card">${currentPlanPanel()}</section><div id="plansArea" class="partner-plans plans-clean">${Object.keys(merchantPlanData).map(merchantPlanCard).join('')}</div>`}
function openPlanReview(k){selectedMerchantPlan=k;state.page='planReview';renderPage();document.querySelector('.content')?.scrollTo({top:0,behavior:'smooth'})}
function pagePlanReview(){const p=merchantPlanData[selectedMerchantPlan];const vat=p.annual*.05,total=p.annual+vat;return `${title('مرور و تأیید پلن','پیش از فعال‌سازی، جزئیات سفارش را بررسی و تأیید کنید')}<div class="plan-review-layout"><section class="card plan-review-main"><button class="review-back" onclick="go('plans')">→ بازگشت به پلن‌ها</button><div class="review-heading"><span class="review-check">✓</span><div><small>پلن انتخاب‌شده</small><h2>${p.title}</h2><p>${p.tag}</p></div></div><div class="review-features">${p.features.map(f=>`<span>✓ ${f}</span>`).join('')}</div>${p.annual===0?`<div class="free-plan-note"><b>سه ماه استفاده رایگان از سورکده</b><p>پس از تأیید پروفایل کسب‌وکار توسط ادمین، این پلن برای ۳ ماه بدون هزینه فعال می‌شود و می‌توانید از خدمات سورکده استفاده کنید.</p></div>`:`<div class="payment-note"><b>پرداخت امن از طریق بانک سامان</b><p>پس از تأیید سفارش، برای تکمیل پرداخت به درگاه آزمایشی بانک سامان هدایت می‌شوید.</p></div>`}<label class="review-terms"><input id="planTerms" type="checkbox"><span>شرایط استفاده و جزئیات پلن را مطالعه کرده‌ام و تأیید می‌کنم.</span></label></section><aside class="card order-summary"><h2>خلاصه سفارش</h2><div><span>مبلغ اشتراک سالانه</span><b>${p.annual?`AED ${p.annual.toLocaleString('en-US')}`:'رایگان'}</b></div><div><span>کمیسیون هر اعتبار</span><b>${p.commission}</b></div><div><span>مدت اعتبار</span><b>${p.duration}</b></div>${p.annual?`<div><span>مالیات ۵٪</span><b>AED ${vat.toLocaleString('en-US')}</b></div><div class="order-total"><span>مبلغ نهایی</span><b>AED ${total.toLocaleString('en-US')}</b></div>`:''}<button class="btn primary" onclick="continuePlanPurchase()">${p.annual?'ادامه و ورود به درگاه':'تأیید و درخواست فعال‌سازی'}</button><small>اطلاعات سفارش قبل از ثبت نهایی دوباره قابل بررسی است.</small></aside></div>`}
function continuePlanPurchase(){const terms=document.getElementById('planTerms');if(!terms?.checked){toast('برای ادامه، شرایط پلن را تأیید کنید');return}const p=merchantPlanData[selectedMerchantPlan];if(!p.annual){document.getElementById('page').innerHTML=`<div class="plan-result card"><span>✓</span><h2>درخواست پلن رایگان ثبت شد</h2><p>پس از تأیید پروفایل شما توسط ادمین، استفاده رایگان سه‌ماهه از خدمات سورکده فعال خواهد شد.</p><button class="btn primary" onclick="go('dashboard')">بازگشت به داشبورد</button></div>`;return}state.page='samanGateway';renderPage()}
function pageSamanGateway(){const p=merchantPlanData[selectedMerchantPlan],total=p.annual*1.05;return `${title('درگاه پرداخت','نسخه نمایشی درگاه بانک سامان')}<section class="saman-gateway"><header><div class="saman-mark">S</div><div><b>پرداخت اینترنتی بانک سامان</b><small>درگاه آزمایشی · اطلاعات واقعی وارد نکنید</small></div><span>زمان باقی‌مانده ۰۹:۵۹</span></header><div class="gateway-body"><div class="gateway-merchant"><div><small>پذیرنده</small><b>شرکت خدمات سورکده</b></div><div><small>شرح پرداخت</small><b>اشتراک سالانه ${p.title}</b></div><div><small>مبلغ قابل پرداخت</small><b>AED ${total.toLocaleString('en-US')} <em>معادل ریالی درگاه</em></b></div></div><div class="gateway-form"><div class="field"><label>شماره کارت</label><input inputmode="numeric" maxlength="19" placeholder="----  ----  ----  ----"></div><div class="gateway-row"><div class="field"><label>CVV2</label><input inputmode="numeric" maxlength="4"></div><div class="field"><label>تاریخ انقضا</label><input placeholder="ماه / سال"></div></div><div class="field"><label>رمز پویا</label><div class="otp-row"><input inputmode="numeric"><button class="btn">دریافت رمز پویا</button></div></div><div class="gateway-actions"><button class="btn primary" onclick="finishSamanPayment()">پرداخت آزمایشی</button><button class="btn" onclick="go('planReview')">انصراف و بازگشت</button></div></div></div></section>`}
function finishSamanPayment(){document.getElementById('page').innerHTML=`<div class="plan-result card"><span>✓</span><h2>پرداخت آزمایشی موفق بود</h2><p>درخواست فعال‌سازی پلن ثبت شد و نتیجه پس از بررسی در اعلان‌ها نمایش داده می‌شود.</p><button class="btn primary" onclick="go('dashboard')">بازگشت به داشبورد</button></div>`}
function aToggle(id){const a=addons.find(x=>x[0]===id);if(a){a[4]=!a[4];renderPage();}}
function openMerchantPlanInvoice(){const p=merchantPlanData[selectedMerchantPlan];modal(`<h2>فاکتور اشتراک مرچنت</h2><div class="checkout-summary"><div class="checkout-line"><span>پلن</span><b>${p.title}</b></div><div class="checkout-line"><span>دوره پرداخت</span><b>ماهانه</b></div><div class="checkout-line"><span>حق اشتراک</span><b>AED ${p.monthly}</b></div><div class="checkout-line"><span>استفاده رایگان ماهانه</span><b>${p.free} مورد</b></div><div class="checkout-line"><span>هزینه هر استفاده اضافه</span><b>AED ${p.fee}</b></div></div><br><button class="btn primary" onclick="closeModal();toast('پرداخت اشتراک مرچنت با موفقیت ثبت شد')">پرداخت آزمایشی</button>`)}

function pageAccount(){const items=[['plans','◆','پلن‌ها','مشاهده پلن فعلی، مقایسه و خرید پلن'],['profile','●','پروفایل','مدیریت اطلاعات کسب‌وکار و شعب'],['menu','≡','خدمات','مدیریت دسته‌بندی‌ها و خدمات'],['offers','★','پیشنهادات','مدیریت پکیج‌ها و پیشنهادهای مشتریان'],['customers','♙','مشتریان','سوابق مراجعه، اعتبار مصرفی و نظرات'],['finance','▣','تسویه و مالی','مشاهده درآمد، کمیسیون و تسویه‌ها']];return `${title('حساب کاربری','مدیریت بخش‌های اصلی حساب مرچنت')}<div class="account-menu">${items.map(x=>`<button class="account-menu-row" onclick="go('${x[0]}')"><span class="account-menu-icon">${x[1]}</span><span class="account-menu-copy"><b>${x[2]}</b><small>${x[3]}</small></span><span class="account-menu-arrow">‹</span></button>`).join('')}<button class="btn account-logout" onclick="logoutMerchant()">خروج</button></div>`}

function pinProfileMap(e){const map=e.currentTarget;const pin=document.getElementById('profilePin');if(!pin)return;const rect=map.getBoundingClientRect();const x=((e.clientX-rect.left)/rect.width)*100;const y=((e.clientY-rect.top)/rect.height)*100;pin.style.left=Math.max(3,Math.min(94,x))+'%';pin.style.top=Math.max(3,Math.min(94,y))+'%';toast('پین نقشه تغییر کرد؛ برای انتشار نیازمند تأیید ادمین است')}

function applySoorkadehBranding(html){return html.replaceAll('Venus','Soorkadeh').replaceAll('VENUS','SOORKADEH').replaceAll('venus','soorkadeh').replaceAll('ونوس','سورکده').replaceAll('کوپن','کردیت (اعتبار)')}
function enhanceProfileUI(){if(state.page!=='profile')return;document.querySelectorAll('.field').forEach(f=>{const label=f.querySelector('label'),input=f.querySelector('input');if(label&&input&&/شماره تماس|تلفن شعبه/.test(label.textContent)&&!f.querySelector('.phone-field')){input.value=input.value.replace(/^\+\d+\s*/, '');const wrap=document.createElement('div');wrap.className='phone-field';const select=document.createElement('select');select.setAttribute('aria-label','کد کشور');select.innerHTML='<option selected>🇮🇷 +98</option><option>🇦🇪 +971</option><option>🇹🇷 +90</option><option>🇬🇧 +44</option>';input.parentNode.insertBefore(wrap,input);wrap.append(select,input)}});const gallery=document.querySelector('#profile-gallery .card');if(gallery&&!gallery.querySelector('.multi-upload')){const old=gallery.querySelector('.profile-gallery');if(old)old.remove();gallery.insertAdjacentHTML('beforeend','<label class="multi-upload"><input type="file" accept="image/*" multiple onchange="previewProfileImages(this)"><b>انتخاب هم‌زمان چند تصویر</b><small>برای هر تصویر عنوان دلخواه بنویسید و یک تصویر را به‌عنوان عکس اصلی انتخاب کنید.</small></label><div id="profileUploadPreview" class="profile-gallery upload-preview"></div>')}}
function previewProfileImages(input){const box=document.getElementById('profileUploadPreview');box.innerHTML=[...input.files].map((f,i)=>`<article class="uploaded-photo"><div class="square-photo"><img src="${URL.createObjectURL(f)}" alt="پیش‌نمایش تصویر ${i+1}"><label class="main-photo-choice"><input type="radio" name="mainProfilePhoto" ${i===0?'checked':''}> عکس اصلی</label></div><div class="photo-title-field"><label for="photoTitle${i}">عنوان تصویر</label><input id="photoTitle${i}" value="تصویر ${i+1}" placeholder="مثلاً فضای داخلی رستوران"></div></article>`).join('')}
function renderPage(){const pages={dashboard:pageDashboardCompact,validate:pageValidate,plans:pagePartnerPlans,planReview:pagePlanReview,samanGateway:pageSamanGateway,profile:pageProfile,menu:pageMenu,offers:pageCoupons,customers:pageCustomers,reviews:pageReviews,finance:pageFinance,support:pageSupport,account:pageAccount};document.getElementById('page').innerHTML=applySoorkadehBranding((pages[state.page]||pageDashboardCompact)());enhanceProfileUI()}
function modal(html){document.getElementById('modal').innerHTML=`<div class="modal"><div class="modalbox">${html}<br><button class="btn" onclick="closeModal()">بستن</button></div></div>`}function closeModal(){document.getElementById('modal').innerHTML=''}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}
function openNotifications(){document.getElementById('modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalbox notif-modal"><div class="notif-head"><div><h2>اعلان‌ها</h2><small>۳ اعلان خوانده‌نشده</small></div><button class="btn" onclick="closeModal()">بستن</button></div><div class="notif-list"><div class="notif-item"><span class="notif-dot">✓</span><div><b>اعتبارسنجی جدید ثبت شد</b><p>۳ استفاده موفق امروز</p></div><time>۵ دقیقه پیش</time></div><div class="notif-item"><span class="notif-dot">↗</span><div><b>تسویه آماده بررسی است</b><p>گزارش مالی تیرماه</p></div><time>۱ ساعت پیش</time></div><div class="notif-item"><span class="notif-dot">★</span><div><b>نظر جدید مشتری</b><p>امتیاز ۵ برای خدمات</p></div><time>امروز</time></div></div><div class="notif-footer">با مشاهده این صفحه، اعلان‌ها خوانده‌شده محسوب می‌شوند.</div></div></div>`}function couponModal(){modal('<h2>ایجاد کوپن</h2><div class="form"><div class="field"><label>عنوان</label><input value="غذای اصلی منتخب"></div><div class="field"><label>میانگین</label><input value="120"></div><div class="field"><label>انقضا</label><input value="2026/09/01"></div><div class="field"><label>وضعیت</label><select><option>فعال</option></select></div></div><br><button class="btn primary" onclick="closeModal();toast(\'کوپن ایجاد شد\')">ذخیره</button>')}function serviceCategoryModal(){openServiceModal('parent')}function menuModal(parent=''){openServiceModal('parent')}function staffModal(){modal('<h2>دعوت کارمند</h2><div class="form"><input placeholder="نام"><input placeholder="موبایل"><input placeholder="ایمیل"><select><option>صندوق‌دار</option><option>مدیر شعبه</option></select></div><br><button class="btn primary">ارسال دعوتنامه</button>')}function ticketModal(){modal('<h2>ثبت تیکت جدید</h2><div class="form"><div class="field"><label>موضوع تیکت</label><input placeholder="مثلاً مشکل در تسویه"></div><div class="field"><label>دسته‌بندی</label><select><option>مالی</option><option>فنی</option><option>پروفایل و تأیید ادمین</option><option>سایر موارد</option></select></div><div class="field"><label>شماره تماس</label><input placeholder="شماره تماس برای پیگیری"></div><div class="field" style="grid-column:1/-1"><label>شرح درخواست</label><textarea placeholder="شرح کامل مشکل یا درخواست را بنویسید"></textarea></div></div><br><button class="btn primary" onclick="closeModal();toast(&quot;تیکت جدید ثبت شد&quot;)">ثبت تیکت</button>')}
renderNav();renderPage();updateBreadcrumb();
</script>
</body>
